<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>มอนสเตอร์หิวขยะ กู้เมืองสะอาด</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#6b6f73;font-family:"Kanit",Tahoma,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100vw;height:100vh}
  video{display:none}
  .card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:min(880px,90vw);max-height:92vh;overflow:auto;box-sizing:border-box;
        display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:30px 28px;
        background:rgba(255,255,255,.94);color:#24323f;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .card h1{margin:0;font-size:clamp(34px,5.4vw,62px);font-weight:800;line-height:1.15;color:#2f9e5b}
  .card p{font-size:clamp(17px,2vw,23px);margin:0;line-height:1.5}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{font:inherit;font-size:clamp(19px,2.2vw,26px);font-weight:800;padding:12px 30px;border:0;border-radius:999px;cursor:pointer;color:#fff;
         background:#2f9e5b;box-shadow:0 6px 0 #1f7442,0 10px 20px rgba(0,0,0,.18)}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #1f7442}
  button.blue{background:#2f8fe0;box-shadow:0 6px 0 #1d64a3,0 10px 20px rgba(0,0,0,.18)}
  button.pink{background:#f0568f;box-shadow:0 6px 0 #b83568,0 10px 20px rgba(0,0,0,.18)}
  .legend span{font-weight:800;padding:6px 16px;border-radius:999px;color:#fff;font-size:clamp(15px,1.7vw,20px)}
  .hidden{display:none!important}
  #status{font-size:16px;color:#6a7883}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="c"></canvas>

<div id="start" class="card">
  <h1>มอนสเตอร์หิวขยะ!</h1>
  <p>เมืองของเราเต็มไปด้วยขยะ! เอามือไปที่ขยะแล้ว<b>กำมือ</b>เพื่อจับ<br>ลากไปเหนือมอนสเตอร์ให้ถูกตัว แล้ว<b>แบมือ</b>ปล่อยลงปาก ยิ่งป้อนถูก เมืองยิ่งสะอาด!</p>
  <div class="row legend">
    <span style="background:#3fb35f">ขยะเปียก</span><span style="background:#f2b705">รีไซเคิล</span>
    <span style="background:#2f8fe0">ขยะทั่วไป</span><span style="background:#e5484d">ขยะอันตราย</span>
  </div>
  <div class="row">
    <button class="blue" onclick="startGame('solo')">เล่นคนเดียว</button>
    <button class="pink" onclick="startGame('duo')">แข่ง 2 คน</button>
  </div>
  <div id="status">กำลังเปิดกล้อง...</div>
</div>

<div id="end" class="card hidden">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <div class="row"><button class="blue" onclick="showStart()">กลับเมนู</button></div>
</div>

<script type="module">
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const video = document.getElementById('video'), statusEl = document.getElementById('status');
const FONT = 'Kanit,Tahoma,sans-serif';
const P_COLORS = ['#f0568f', '#2f8fe0'], P_NAMES = ['ฝั่งซ้าย', 'ฝั่งขวา'];
const GAME_TIME = 60, CLEAN_TARGET = 15;
let W, H, DPR = 1;

const MONSTERS = {
  green:  {name:'ขยะเปียก',   body:'#3fb35f', dark:'#2a8a45', lid:'#23733a'},
  yellow: {name:'รีไซเคิล',   body:'#f2b705', dark:'#c99700', lid:'#a87d00'},
  blue:   {name:'ขยะทั่วไป', body:'#2f8fe0', dark:'#2470b5', lid:'#1c5a92'},
  red:    {name:'ขยะอันตราย', body:'#e5484d', dark:'#bd3237', lid:'#962528'},
};
const ITEMS = [
  {e:'🍌',n:'เปลือกกล้วย',b:'green',f:'เศษอาหารหมักเป็นปุ๋ยให้ต้นไม้ได้'},
  {e:'🍎',n:'แกนแอปเปิล',b:'green',f:'ขยะเปียกย่อยสลายได้เองตามธรรมชาติ'},
  {e:'🥚',n:'เปลือกไข่',b:'green',f:'เปลือกไข่บดเป็นปุ๋ยให้ต้นไม้ได้'},
  {e:'🍂',n:'ใบไม้แห้ง',b:'green',f:'ใบไม้แห้งทำปุ๋ยหมักได้ดีมาก'},
  {e:'🐟',n:'ก้างปลา',b:'green',f:'เศษอาหารควรแยกออก ไม่ให้ปนกับขยะอื่น'},
  {e:'🍉',n:'เปลือกแตงโม',b:'green',f:'เปลือกผลไม้เป็นอาหารของไส้เดือนได้'},
  {e:'🍚',n:'ข้าวเหลือ',b:'green',f:'กินข้าวให้หมดจาน ช่วยลดขยะเปียกได้'},
  {e:'🥕',n:'เศษผัก',b:'green',f:'เศษผักทำปุ๋ยหมักหรือน้ำหมักชีวภาพได้'},
  {e:'☕',n:'กากกาแฟ',b:'green',f:'กากกาแฟโรยดินช่วยบำรุงต้นไม้ได้'},
  {e:'🍗',n:'กระดูกไก่',b:'green',f:'เศษอาหารทุกชนิดเป็นขยะเปียก'},
  {e:'🧴',n:'ขวดพลาสติก',b:'yellow',f:'ขวดพลาสติกรีไซเคิลเป็นเสื้อได้นะ'},
  {e:'🥫',n:'กระป๋อง',b:'yellow',f:'กระป๋องอะลูมิเนียมรีไซเคิลได้แทบไม่จำกัดครั้ง'},
  {e:'📰',n:'หนังสือพิมพ์',b:'yellow',f:'รีไซเคิลกระดาษช่วยลดการตัดต้นไม้'},
  {e:'📦',n:'กล่องกระดาษ',b:'yellow',f:'กล่องกระดาษนำกลับมาทำกล่องใหม่ได้'},
  {e:'🍾',n:'ขวดแก้ว',b:'yellow',f:'แก้วหลอมแล้วทำขวดใหม่ได้เรื่อย ๆ'},
  {e:'🥛',n:'กล่องนม',b:'yellow',f:'กล่องนมรีไซเคิลทำเป็นแผ่นหลังคาได้'},
  {e:'📄',n:'กระดาษ A4',b:'yellow',f:'ใช้กระดาษสองหน้าก่อนทิ้ง ช่วยประหยัดต้นไม้'},
  {e:'🥤',n:'แก้วพลาสติก',b:'yellow',f:'ล้างแก้วก่อนทิ้ง จะรีไซเคิลได้ง่ายขึ้น'},
  {e:'🍬',n:'ซองขนม',b:'blue',f:'ซองขนมมีหลายชั้นซ้อนกัน เลยรีไซเคิลยาก'},
  {e:'🧻',n:'ทิชชู่ใช้แล้ว',b:'blue',f:'ทิชชู่ใช้แล้วสกปรก รีไซเคิลไม่ได้'},
  {e:'🍱',n:'กล่องโฟม',b:'blue',f:'โฟมใช้เวลาย่อยสลายนานหลายร้อยปี'},
  {e:'🩹',n:'พลาสเตอร์ยา',b:'blue',f:'ของใช้แล้วที่ปนเปื้อน ทิ้งถังทั่วไป'},
  {e:'🥢',n:'ตะเกียบใช้แล้ว',b:'blue',f:'ของใช้แล้วที่เปื้อนอาหาร ทิ้งถังทั่วไป'},
  {e:'😷',n:'หน้ากากอนามัย',b:'blue',f:'หน้ากากใช้แล้ว พับใส่ถุงก่อนทิ้งนะ'},
  {e:'🥡',n:'กล่องข้าวเปื้อน',b:'blue',f:'กล่องที่เปื้อนอาหารมาก รีไซเคิลไม่ได้'},
  {e:'🔋',n:'ถ่านไฟฉาย',b:'red',f:'ถ่านมีสารเคมีอันตรายต่อดินและน้ำ'},
  {e:'💡',n:'หลอดไฟ',b:'red',f:'หลอดไฟบางชนิดมีสารปรอทอยู่ข้างใน'},
  {e:'💊',n:'ยาหมดอายุ',b:'red',f:'ยาหมดอายุห้ามทิ้งรวมกับขยะทั่วไป'},
  {e:'📱',n:'มือถือเก่า',b:'red',f:'ขยะอิเล็กทรอนิกส์มีโลหะหนัก ต้องแยกทิ้ง'},
  {e:'🧯',n:'กระป๋องสเปรย์',b:'red',f:'กระป๋องสเปรย์มีแรงดัน ห้ามเผาเด็ดขาด'},
  {e:'🧪',n:'น้ำยาเคมี',b:'red',f:'น้ำยาเคมีห้ามเทลงท่อ เป็นอันตรายต่อสัตว์น้ำ'},
  {e:'🔌',n:'สายชาร์จเสีย',b:'red',f:'เครื่องใช้ไฟฟ้าเสียเป็นขยะอันตราย'},
];
const KEYS = ['green','yellow','blue','red'];

let mode = 'solo', state = 'menu', players = [], countdown = 0, lastT = 0, playT = 0, lastBeep = 4;
let particles = [], banner = null, clean = 0, cleanShow = 0;

function resize(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  players.forEach(layoutPlayer);
  buildCity();
}
addEventListener('resize', resize);

// ---------- เสียง ----------
let actx = null;
function audio(){ if (!actx) try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch {} return actx; }
function tone(f, d=0.15, type='sine', vol=0.12, delay=0, f2=null){
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.01); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.05);
}
const sfx = {
  bump:  v => tone(220 + Math.min(v,1)*260, 0.08, 'triangle', 0.08 + Math.min(v,1)*0.08),
  chomp: ()=>{ for (let i=0;i<3;i++) tone(200-i*25, 0.08, 'triangle', 0.16, i*0.11); tone(784,0.15,'sine',0.12,0.36); tone(1046,0.22,'sine',0.12,0.46); },
  yuck:  ()=> tone(380, 0.45, 'sawtooth', 0.07, 0, 90),
  combo: n => [659,784,988,1175].slice(0, Math.min(4, n)).forEach((f,i)=>tone(f,0.12,'sine',0.1,0.55+i*0.07)),
  beep:  ()=> tone(523, 0.15, 'sine', 0.15),
  go:    ()=> tone(880, 0.35, 'sine', 0.18),
  win:   ()=> [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.3,'triangle',0.14,i*0.13)),
};

// ---------- เมนู ----------
window.showStart = ()=>{
  state = 'menu'; players = []; clean = 0;
  document.getElementById('end').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
};
window.startGame = m => {
  audio(); mode = m;
  const order = []; while (order.length < 150) order.push(...[...ITEMS].sort(()=>Math.random()-0.5));
  players = mode==='solo' ? [makePlayer(0,0,1,order)] : [makePlayer(0,0,0.5,order), makePlayer(1,0.5,1,order)];
  players.forEach(layoutPlayer);
  particles = []; banner = null; clean = 0; state = 'countdown'; countdown = 3.999; lastBeep = 4;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
};
addEventListener('keydown', e=>{
  if (e.code === 'Space' && state === 'over') showStart();
  if (e.code === 'Escape') showStart();
});

// ---------- ผู้เล่น ----------
function makePlayer(idx, f0, f1, order){
  return {idx, f0, f1, order, k:0, item:null, score:0, wrong:0, combo:0, best:0, msg:null, mons:[], R:40,
          hand:null, mouse:null};
}
function layoutPlayer(p){
  p.x0 = p.f0*W; p.x1 = p.f1*W;
  const w = p.x1-p.x0, slot = w/KEYS.length;
  const mw = Math.min(slot*0.78, 250), mh = Math.min(H*0.3, mw*1.12);
  p.R = Math.min(w*0.045, H*0.06);
  const old = p.mons;
  p.mons = KEYS.map((k,i)=>({k, ...MONSTERS[k], x: p.x0 + slot*(i+0.5) - mw/2, y: H - mh - 14, w: mw, h: mh,
    open: 0, chomp: 0, happy: 0, yuck: 0, shake: 0, ph: Math.random()*6, ...(old[i] ? {open:old[i].open} : {})}));
}
function nextItem(p){
  const it = p.order[p.k++ % p.order.length], w = p.x1-p.x0;
  p.item = {...it, x: p.x0 + w*(0.2+Math.random()*0.6), y: -p.R, vx: 0, vy: 0, rot: 0, spit: 0, held: false, wob: 0};
}

// ---------- ฟิสิกส์ขยะ ----------
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const PALM = [[0,9],[0,13],[1,5],[2,5],[5,13],[9,17],[0,5]]; // เส้นเสริมให้ฝ่ามือทึบ ขยะไม่ลอดง่าย
const COLLIDE = BONES.concat(PALM);
function grip(p){ // ตำแหน่งกลางฝ่ามือ + สถานะกำมือ
  if (p.hand) return {x:p.hand.c.x, y:p.hand.c.y, closed:p.hand.closed, hr:p.hand.hr};
  if (p.mouse) return {x:p.mouse.x, y:p.mouse.y, closed:!!p.mouse.down, hr:Math.min(W,H)*0.031};
  return null;
}
function updatePlayer(p, dt){
  for (const m of p.mons){ m.chomp = Math.max(0,m.chomp-dt); m.happy = Math.max(0,m.happy-dt); m.yuck = Math.max(0,m.yuck-dt); m.shake = Math.max(0,m.shake-dt*2); }
  const it = p.item; if (!it) return;
  const R = p.R, h = grip(p);
  it.near = false;
  if (it.spit > 0){ // ถูกคายออกมา
    it.spit -= dt; it.vy += H*2.5*dt; it.x += it.vx*dt; it.y += it.vy*dt;
    it.x = Math.max(p.x0+R, Math.min(p.x1-R, it.x));
    if (it.spit <= 0){ it.y = Math.min(it.y, H*0.35); it.falling = false; }
  } else if (it.held){
    if (!h){ p.lost = (p.lost||0) + dt; if (p.lost > 0.6){ it.held = false; it.falling = true; it.vy = 0; } }
    else {
      p.lost = 0;
      it.x += (h.x - it.x)*0.6; it.y += (h.y - it.y)*0.6;
      it.x = Math.max(p.x0+R, Math.min(p.x1-R, it.x));
      if (!h.closed){ it.held = false; it.falling = true; it.vy = 0; sfx.bump(0.2); } // แบมือ = ปล่อย
    }
  } else if (it.falling){ // ร่วงลงหลังปล่อยมือ
    it.vy += H*2.2*dt; it.y += it.vy*dt;
    if (it.y > H + R){ it.falling = false; it.y = -R; }
  } else {
    it.wob = (it.wob||0) + dt*2; const stopY = H*0.33;
    if (it.y < stopY) it.y = Math.min(stopY, it.y + H*0.3*dt); else it.y = stopY + Math.sin(it.wob)*12;
    if (h && Math.hypot(it.x - h.x, it.y - h.y) < h.hr + R*0.6){ // ขยะอยู่ในวงฝ่ามือ
      it.near = true;
      if (h.closed && !p.wasClosed){ it.held = true; sfx.bump(0.6); } // กำมือตอนอยู่ใกล้ = จับ
    }
  }
  p.wasClosed = h ? h.closed : false;
  // ร่วงลงปากมอนสเตอร์
  if ((it.falling || it.held) && it.spit <= 0){
    const m = p.mons.find(m => it.x > m.x && it.x < m.x + m.w && it.y > m.y + m.h*0.12);
    if (m){ feed(p, m); return; }
  }
  it.rot = it.held ? 0 : Math.sin((it.wob||0))*0.15;
  for (const m of p.mons){
    const near = (it.held || it.falling) ? Math.max(0, 1 - Math.hypot(it.x-(m.x+m.w/2), it.y-(m.y+m.h*0.45)) / (m.w*1.6)) : 0;
    m.open += (near - m.open)*Math.min(1, dt*10);
  }
}
function feed(p, m){
  const it = p.item;
  if (m.k === it.b){
    p.score++; p.combo++; p.best = Math.max(p.best, p.combo);
    m.chomp = 0.55; m.happy = 1.1; sfx.chomp();
    if (p.combo >= 3) sfx.combo(p.combo - 1);
    sparkle(m.x+m.w/2, m.y+m.h*0.3, [m.body,'#ffffff','#ffe066'], 26);
    p.msg = {ok:true, title: p.combo >= 3 ? `อร่อย! คอมโบ x${p.combo}` : `อร่อย! ${it.n} → ${m.name}`, text: it.f, t: mode==='solo'?3:1.6};
    clean = Math.min(1, players.reduce((s,q)=>s+q.score,0) / (CLEAN_TARGET*players.length));
    nextItem(p);
  } else {
    p.wrong++; p.combo = 0; m.yuck = 1; m.shake = 1; sfx.yuck();
    p.msg = {ok:false, title:`แหวะ! ${it.n} ไม่ใช่${m.name}`, text:`ต้องป้อนให้ตัว "${MONSTERS[it.b].name}" นะ`, t:2.4};
    it.held = false; it.falling = false; it.y = m.y - p.R; it.vy = -H*1.3; it.vx = (Math.random()-0.5)*H*0.8; it.spit = 0.7;
  }
}
function sparkle(x, y, cols, n){
  for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=120+Math.random()*320;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-200,c:cols[i%cols.length],life:1,r:4+Math.random()*6,g:800}); }
}
function confetti(x0, x1){
  const cols = ['#f0568f','#2f8fe0','#ffd23f','#3fb35f','#ffffff','#9b6cf0'];
  for (let i=0;i<200;i++) particles.push({x:x0+Math.random()*(x1-x0), y:-20-Math.random()*H*0.5, vx:(Math.random()-0.5)*120, vy:100+Math.random()*200, c:cols[i%6], life:3.5, r:5+Math.random()*5, slow:true});
}

// ---------- จบเกม ----------
function endGame(){
  state = 'over'; sfx.win();
  if (mode === 'solo'){
    const p = players[0]; confetti(0, W);
    const title = p.score >= 15 ? 'เมืองสะอาดสดใสที่สุด!' : p.score >= 10 ? 'เมืองสะอาดขึ้นเยอะเลย!' : p.score >= 5 ? 'เมืองเริ่มสะอาดแล้ว!' : 'ช่วยกันอีกนิดนะ!';
    setTimeout(()=>{
      setTitle(title, '#2f9e5b');
      document.getElementById('endText').innerHTML = `ป้อนถูก <b>${p.score}</b> ชิ้น · ป้อนผิด ${p.wrong} ชิ้น · คอมโบสูงสุด x${p.best}<br>ความสะอาดของเมือง <b>${Math.round(clean*100)}%</b><br><span style="font-size:.85em;color:#5a6b78">กลับบ้านไปช่วยที่บ้านแยกขยะด้วยนะ เมืองของเราจะได้สะอาดแบบนี้จริง ๆ</span>`;
      document.getElementById('end').classList.remove('hidden');
    }, 2200);
    return;
  }
  const [a, b] = players;

// ---------- จับมือ ----------
let handOK = false, landmarker = null, lastVideoTime = -1, mouse = null;
addEventListener('mousedown', ()=>{ if (mouse) mouse.down = true; });
addEventListener('mouseup', ()=>{ if (mouse) mouse.down = false; });
addEventListener('mousemove', e=>{
  if (handOK) return;
  const now = performance.now();

    const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = d => ({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d}, runningMode:'VIDEO', numHands:2});
    try { landmarker = await HandLandmarker.createFromOptions(fs, opts('GPU')); }
    catch { landmarker = await HandLandmarker.createFromOptions(fs, opts('CPU')); }

    statusEl.textContent = 'พร้อมเล่น! ยืนห่างกล้องประมาณ 1–1.5 เมตร แล้วยกมือขึ้น';

    statusEl.textContent = 'เปิดกล้องหรือตัวจับมือไม่ได้ ตอนนี้เล่นด้วยเมาส์ได้ · ตรวจว่าอนุญาตกล้องและต่ออินเทอร์เน็ต';

}
const mapPt = p => ({x:(1-(0.5+(p.x-0.5)*1.4))*W, y:(0.5+(p.y-0.5)*1.4)*H});
function trackHands(dt){
  if (!handOK){
    // เมาส์แทนมือ
    players.forEach(p => { p.mouse = null; });
    if (mouse && players.length){ const p = players.find(p => mouse.x >= p.x0 && mouse.x < p.x1) || players[0]; p.mouse = mouse; mouse.v.x *= 0.85; mouse.v.y *= 0.85; }
    return;
  }
  if (video.readyState < 2 || video.currentTime === lastVideoTime) return;
  const now = performance.now(); lastVideoTime = video.currentTime;
  const r = landmarker.detectForVideo(video, now);
  const found = (r.landmarks || []).map(L => { const pts = L.map(mapPt); return {pts, c: {x:(pts[0].x+pts[9].x)/2, y:(pts[0].y+pts[9].y)/2}}; });
  const assigned = players.map(()=>null);
  if (mode === 'solo'){ if (found[0]) assigned[0] = found[0]; }
  else for (const f of found){ const side = f.c.x < W/2 ? 0 : 1; if (!assigned[side]) assigned[side] = f; }
  players.forEach((p,i)=>{
    const f = assigned[i];
    if (!f){ p.hand = null; return; }
    const prev = p.hand, fdt = prev ? Math.max(0.016, (now - prev.t)/1000) : 1;
    // ทำให้นิ่งขึ้นนิดหน่อย และคำนวณความเร็วของทุกจุดบนมือ
    const pts = f.pts.map((q,k) => prev ? {x: prev.pts[k].x + (q.x - prev.pts[k].x)*0.75, y: prev.pts[k].y + (q.y - prev.pts[k].y)*0.75} : q);
    const vel = pts.map((q,k) => prev ? {x:(q.x - prev.pts[k].x)/fdt, y:(q.y - prev.pts[k].y)/fdt} : {x:0,y:0});
    const d = (a,b)=>Math.hypot(pts[a].x-pts[b].x, pts[a].y-pts[b].y), palm = d(0,9) || 1;
    const ratio = (d(8,0)+d(12,0)+d(16,0)+d(20,0))/4/palm;
    const was = prev ? prev.closed : false, closed = was ? ratio < 1.55 : ratio < 1.25;
    const hr = Math.max(Math.min(W,H)*0.031, palm*0.38); // วงฝ่ามือใหญ่เกือบเต็มฝ่ามือ
    p.hand = {pts, vel, t: now, closed, hr, c: {x:(pts[0].x+pts[5].x+pts[9].x+pts[13].x+pts[17].x)/5, y:(pts[0].y+pts[5].y+pts[9].y+pts[13].y+pts[17].y)/5}};
  });
}

    ctx.fillStyle = '#fff'; for (const q of pts){ ctx.beginPath(); ctx.arc(q.x, q.y, 5, 0, Math.PI*2); ctx.fill(); }
  }
  { const r = g.hr; ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, Math.PI*2);
    ctx.fillStyle = held || g.closed ? 'rgba(255,210,63,.2)' : 'rgba(255,255,255,.12)'; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 10; ctx.stroke();
    ctx.strokeStyle = held || g.closed ? '#ffd23f' : (mode==='duo' ? col : '#ffffff'); ctx.lineWidth = 6; ctx.stroke();
    if (!p.hand){ ctx.font = `${r*1.2}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(g.closed ? '✊' : '🖐️', g.x, g.y); } }
  // ป้ายบอกสถานะ
  const t = held ? 'แบมือเพื่อปล่อย' : g.closed ? 'กำอยู่' : '', f = Math.max(14, Math.min(W,H)*0.024);
  if (t){ ctx.font = `800 ${f}px ${FONT}`; const w = ctx.measureText(t).width + 24; ctx.fillStyle = 'rgba(30,45,60,.8)'; ctx.beginPath(); ctx.roundRect(g.x - w/2, g.y + g.hr + 10, w, f*1.6, f*0.8); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, g.x, g.y + g.hr + 10 + f*0.8); }
}
function drawHUD(p){
  const f = Math.max(17, Math.min(W,H)*0.034), remain = Math.max(0, GAME_TIME - playT);
  ctx.font = `800 ${f}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const txt = mode==='solo' ? `เวลา ${Math.ceil(remain)}   ป้อนถูก ${p.score}` : `${P_NAMES[p.idx]}  ${p.score}`;
  const w = ctx.measureText(txt).width + 40, x = p.idx===1 ? p.x1 - 16 - w : p.x0 + 16;
  pill(x, 16, w, f*1.8, mode==='duo' ? P_COLORS[p.idx] : 'rgba(30,45,60,.85)');
  ctx.fillStyle = '#fff'; ctx.fillText(txt, x + 20, 16 + f*0.9);
  if (p.combo >= 2){ ctx.font = `800 ${f*0.85}px ${FONT}`; const ct = `คอมโบ x${p.combo}`, cw = ctx.measureText(ct).width + 30, cx = p.idx===1 ? p.x1 - 16 - cw : p.x0 + 16;
    pill(cx, 16 + f*2.1, cw, f*1.4, '#ffd23f'); ctx.fillStyle = '#3a2a00'; ctx.fillText(ct, cx + 15, 16 + f*2.8); }
}
function drawCleanBar(){
  const f = Math.max(16, Math.min(W,H)*0.03), bw = Math.min(W*0.32, 380), x = (W - bw)/2, y = mode==='duo' ? 16 + f*2.3 : 18;
  ctx.font = `800 ${f*0.85}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  pill(x - 10, y, bw + 20, f*2.2, 'rgba(255,255,255,.92)');
  ctx.fillStyle = '#2b3a46'; ctx.fillText(state === 'over' ? 'เมืองสะอาดแล้ว! ขอบคุณที่ช่วยกันนะ' : `ความสะอาดของเมือง ${Math.round(cleanShow*100)}%`, W/2, y + f*0.6);
  ctx.fillStyle = '#e3e7ea'; ctx.beginPath(); ctx.roundRect(x + 6, y + f*1.2, bw - 12, f*0.6, f*0.3); ctx.fill();
  const g = ctx.createLinearGradient(x, 0, x + bw, 0); g.addColorStop(0, '#a08c5b'); g.addColorStop(1, '#3fb35f');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x + 6, y + f*1.2, Math.max(f*0.6, (bw - 12)*cleanShow), f*0.6, f*0.3); ctx.fill();
}
function drawDuoMiddle(){
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 4; ctx.setLineDash([14,12]);
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke(); ctx.setLineDash([]);
  const f = Math.max(16, Math.min(W,H)*0.034), remain = Math.max(0, GAME_TIME - playT);
  pill(W/2 - f*1.6, 14, f*3.2, f*1.8, remain < 10 ? '#e5484d' : 'rgba(30,45,60,.85)');
  textOutlined(`${Math.ceil(remain)}`, W/2, 14 + f*0.9, f, '#fff', 'transparent');
}
function drawMsg(p, dt){
  const m = p.msg; if (!m) return;
  m.t -= dt; if (m.t <= 0){ p.msg = null; return; }
  const pw = p.x1 - p.x0, solo = mode==='solo', f = Math.max(17, Math.min(pw, H*1.6)*(solo ? 0.028 : 0.034));
  const two = solo && m.text, w = Math.min(pw*0.86, 900), h = two ? f*3.4 : f*2.1, x = p.x0 + (pw - w)/2, y = H*0.2;
  ctx.globalAlpha = Math.min(1, m.t*2);
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.roundRect(x, y + 5, w, h, 22); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 22); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `800 ${f}px ${FONT}`; ctx.fillStyle = m.ok ? '#2f9e5b' : '#e5484d';
  ctx.fillText(m.title, x + w/2, y + (two ? f*1.05 : h/2), w - 30);
  if (two){ ctx.font = `400 ${f*0.85}px ${FONT}`; ctx.fillStyle = '#3a4a56'; ctx.fillText(m.text, x + w/2, y + f*2.35, w - 30); }
  ctx.globalAlpha = 1;
}
function drawParticles(dt){
  for (const p of particles){
    if (p.slow){ p.vx += (Math.random()-0.5)*40*dt; p.vy = Math.min(p.vy + 40*dt, 260); } else p.vy += (p.g||800)*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*(p.slow ? 0.6 : 1.3);
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; particles = particles.filter(p => p.life > 0 && p.y < H + 40);
}
function drawCountdown(dt){
  countdown -= dt;
  const n = Math.ceil(countdown);
  if (n !== lastBeep && n >= 1){ sfx.beep(); lastBeep = n; }
  if (countdown <= 0){ sfx.go(); state = 'play'; playT = 0; players.forEach(nextItem); banner = {text:'ไป!', t:0.8}; return; }
  const frac = countdown - Math.floor(countdown);
  textOutlined(String(n), W/2, H*0.38, Math.min(W,H)*(0.2 + 0.06*frac), '#ffd23f');
  textOutlined(mode==='duo' ? 'ยืนคนละฝั่ง แล้วยกมือขึ้น!' : 'ยกมือขึ้น เตรียมกำขยะ!', W/2, H*0.56, Math.min(W,H)*0.05);
}
function drawBanner(dt){
  if (!banner) return;
  if (banner.p){ const p = banner.p, s = 1 + Math.sin(performance.now()/180)*0.06;
    textOutlined('ชนะ!', (p.x0+p.x1)/2, H*0.4, Math.min(W,H)*0.15*s, P_COLORS[p.idx]); return; }
  banner.t -= dt; if (banner.t <= 0){ banner = null; return; }
  textOutlined(banner.text, W/2, H*0.4, Math.min(W,H)*0.2*(1+(0.8-banner.t)*0.4), '#3fb35f');
}

function loop(t){
  const dt = Math.min(0.05, (t-lastT)/1000 || 0); lastT = t;
  trackHands(dt);
  // ตอนจบเกม เมืองค่อย ๆ สะอาดเต็มที่เพื่อโชว์ผลงาน
  const targetClean = state === 'over' ? 1 : clean;
  cleanShow += (targetClean - cleanShow)*Math.min(1, dt*2);
  drawCity(t);
  if (state !== 'menu' && players.length){
    if (state === 'play'){
      playT += dt;
      players.forEach(p => updatePlayer(p, dt));
      if (playT >= GAME_TIME) endGame();
    }
    if (mode === 'duo') drawDuoMiddle();
    players.forEach(p => p.mons.forEach(m => drawMonster(m, p, t)));
    players.forEach(drawMonsterLabels);
    if (state === 'play') players.forEach(drawItem);
    players.forEach(drawHand);
    players.forEach(drawHUD);
    if (state !== 'countdown') drawCleanBar();
    players.forEach(p => drawMsg(p, dt));
    if (state === 'countdown') drawCountdown(dt);
    drawBanner(dt);
  }
  drawParticles(dt);
  requestAnimationFrame(loop);
}
window.__p = () => ({players, clean, state});
resize(); initHands(); requestAnimationFrame(loop);
</script>
</body>
